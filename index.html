<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>سينما لايت 📺</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 10px; }
        .row { display: flex; gap: 10px; }
        video { background: #000; border-radius: 5px; width: 100%; aspect-ratio: 16/9; }
        ::webkit-media-text-track-display { font-size: 22px; background: rgba(0,0,0,0.8); }
        #moviePlayer { flex: 3; }
        .sidebar { flex: 1; max-width: 220px; display: flex; flex-direction: column; gap: 5px; background: #1e1e1e; padding: 10px; border-radius: 5px; }
        #chat { height: 150px; overflow-y: auto; background: #2a2a2a; padding: 5px; font-size: 12px; }
        input, button { padding: 5px; border-radius: 4px; border: none; font-weight: bold; }
        button { background: #00adb5; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <div style="margin-bottom: 10px; display: flex; gap: 10px; font-size: 13px; align-items: center; flex-wrap: wrap;">
        <span>ID: <b id="my-id" style="color:#00adb5">...</b></span>
        <input type="text" id="peer-id" placeholder="ID صديقك" style="width: 90px;">
        <button onclick="connect()">اتصال</button>
        <span>الفيلم:</span> <input type="file" id="upload" accept="video/*">
        <button onclick="makeFullscreen()" style="background:#20bf6b">تكبير 📺</button>
    </div>

    <div class="row">
        <video id="moviePlayer" controls>
            <track id="track" kind="subtitles" src="sub.vtt" srclang="ar" label="العربية" default>
        </video>
        <div class="sidebar">
            <div id="chat"></div>
            <div style="display: flex; gap: 2px;">
                <input type="text" id="msg" placeholder="شات..." style="flex:1">
                <button onclick="sendMsg()">ارسل</button>
            </div>
        </div>
    </div>

    <script>
        const player = document.getElementById('moviePlayer'), chat = document.getElementById('chat');
        const shortId = Math.random().toString(36).substring(2, 10);
        let peer = new Peer(shortId), conn, isSync = false, lastTime = 0;

        peer.on('open', id => document.getElementById('my-id').innerText = id);
        peer.on('connection', c => { conn = c; init(); });

        document.getElementById('upload').onchange = e => { 
            if(e.target.files[0]) {
                player.src = URL.createObjectURL(e.target.files[0]);
                player.onloadedmetadata = () => { player.textTracks[0].mode = 'showing'; };
            }
        };

        function connect() { conn = peer.connect(document.getElementById('peer-id').value); init(); }
        function init() { alert("تم الاتصال!"); if(player.src) conn.send({t:'NEED_FILE'}); conn.on('data', d => handleData(d)); }

        player.onplay = () => !isSync && conn?.send({t:'PLAY'});
        player.onpause = () => !isSync && conn?.send({t:'PAUSE'});
        player.ontimeupdate = () => { if(!isSync) lastTime = player.currentTime; };
        player.onseeking = () => { if(!isSync) { player.currentTime = lastTime; conn?.send({t:'SEEK', time: player.currentTime}); }};

        function handleData(d) {
            isSync = true;
            if(d.t === 'PLAY') player.play();
            if(d.t === 'PAUSE') player.pause();
            if(d.t === 'MSG') chat.innerHTML += `<div><b>صديقك:</b> ${d.m}</div>`;
            if(d.t === 'NEED_FILE') alert("اختار نفس الفيلم من جهازك الآن لتظهر الترجمة التلقائية.");
            if(d.t === 'SEEK' && confirm("موافق على تغيير الوقت؟")) { player.currentTime = d.time; conn.send({t:'OK', time: d.time}); }
            if(d.t === 'OK') player.currentTime = d.time;
            setTimeout(() => isSync = false, 400);
        }

        function makeFullscreen() { if (player.requestFullscreen) player.requestFullscreen(); else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen(); }
        function sendMsg() { const i = document.getElementById('msg'); if(!i.value || !conn) return; conn.send({t:'MSG', m: i.value}); chat.innerHTML += `<div><b>أنا:</b> ${i.value}</div>`; i.value = ''; }
    </script>
</body>
</html>
