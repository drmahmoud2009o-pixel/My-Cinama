<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سينما لايت</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; flex: 1; overflow: hidden; }
        video { background: #000; border-radius: 8px; }
        #moviePlayer { flex: 3; width: 100%; }
        .sidebar { flex: 1; max-width: 300px; display: flex; flex-direction: column; gap: 10px; background: #1e1e1e; padding: 10px; border-radius: 8px; }
        .cams { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .cam { width: 100%; aspect-ratio: 1; object-fit: cover; }
        #chat { flex: 1; overflow-y: auto; background: #2a2a2a; padding: 5px; border-radius: 5px; font-size: 14px; }
        input, button { padding: 8px; border-radius: 5px; border: none; font-weight: bold; }
        button { background: #00adb5; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <div style="margin-bottom: 10px; display: flex; gap: 10px; align-items: center;">
        <span>ID الخاص بك: <b id="my-id" style="color:#00adb5">...</b></span>
        <input type="text" id="peer-id" placeholder="ID صديقك">
        <button onclick="connect()">اتصال</button>
        <input type="file" id="upload" accept="video/*">
    </div>

    <div class="row">
        <video id="moviePlayer" controls></video>
        
        <div class="sidebar">
            <div class="cams">
                <video id="localCam" class="cam" autoplay muted playsinline></video>
                <video id="remoteCam" class="cam" autoplay playsinline></video>
            </div>
            <div style="display: flex; gap: 2px; justify-content: center;">
                <button onclick="startCall(true)">فيديو</button>
                <button onclick="startCall(false)">صوت</button>
                <button onclick="stopCall()" style="background:#ff4757">قطع</button>
            </div>
            <div id="chat"></div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="msg" placeholder="اكتب هنا..." style="flex:1">
                <button onclick="sendMsg()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        const player = document.getElementById('moviePlayer'), chat = document.getElementById('chat');
        let peer = new Peer(), conn, stream, isSync = false, lastTime = 0;

        peer.on('open', id => document.getElementById('my-id').innerText = id);
        peer.on('connection', c => { conn = c; init(); });
        peer.on('call', async call => { if(confirm("مكالمة واردة، هل تقبل؟")) { await getMedia(true); call.answer(stream); call.on('stream', r => document.getElementById('remoteCam').srcObject = r); }});

        document.getElementById('upload').onchange = e => { if(e.target.files[0]) player.src = URL.createObjectURL(e.target.files[0]); };

        function connect() { conn = peer.connect(document.getElementById('peer-id').value); init(); }
        function init() { alert("تم الاتصال!"); conn.on('data', d => handleData(d)); }

        player.onplay = () => !isSync && conn?.send({t:'PLAY'});
        player.onpause = () => !isSync && conn?.send({t:'PAUSE'});
        player.ontimeupdate = () => { if(!isSync) lastTime = player.currentTime; };
        player.onseeking = () => { if(!isSync) { player.currentTime = lastTime; conn?.send({t:'SEEK', time: player.currentTime}); alert("تم إرسال طلب تقديم/إرجاع، انتظر الموافقة."); }};

        function handleData(d) {
            isSync = true;
            if(d.t === 'PLAY') player.play();
            if(d.t === 'PAUSE') player.pause();
            if(d.t === 'MSG') msgTxt(d.m, 'صديقك');
            if(d.t === 'SEEK' && confirm("صديقك يريد تغيير الوقت، هل توافق؟")) { player.currentTime = d.time; conn.send({t:'OK', time: d.time}); }
            if(d.t === 'OK') player.currentTime = d.time;
            setTimeout(() => isSync = false, 400);
        }

        async function getMedia(vid) { try { stream = await navigator.mediaDevices.getUserMedia({video: vid, audio: true}); document.getElementById('localCam').srcObject = stream; } catch(e) { alert("خطأ بالصوت/الكاميرا"); } }
        async function startCall(vid) { await getMedia(vid); const call = peer.call(conn.peer, stream); call.on('stream', r => document.getElementById('remoteCam').srcObject = r); }
        function stopCall() { stream?.getTracks().forEach(t => t.stop()); document.getElementById('localCam').srcObject = document.getElementById('remoteCam').srcObject = null; }

        function sendMsg() { const i = document.getElementById('msg'); if(!i.value || !conn) return; conn.send({t:'MSG', m: i.value}); msgTxt(i.value, 'أنا'); i.value = ''; }
        function msgTxt(m, s) { chat.innerHTML += `<div><b>${s}:</b> ${m}</div>`; chat.scrollTop = chat.scrollHeight; }
    </script>
</body>
</html>
